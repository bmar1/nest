
name: Backend CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JVM_VERSION: "21"

jobs:
  test:
    name: Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JVM_VERSION }}
          cache: maven

      - name: Run unit tests
        run: mvn -B test

  build-and-push:
    name: Build & push image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_ACTIONS_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" -q

      - name: Build and push
        env:
          REG_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REPO: ${{ vars.ARTIFACT_REPOSITORY }}
          IMAGE: ${{ vars.IMAGE_NAME }}
        run: |
          set -eux
          TAG_SHA="${REG_HOST}/${PROJECT}/${REPO}/${IMAGE}:${GITHUB_SHA}"
          TAG_LATEST="${REG_HOST}/${PROJECT}/${REPO}/${IMAGE}:latest"
          docker build -t "${TAG_SHA}" -t "${TAG_LATEST}" .
          docker push "${TAG_SHA}"
          docker push "${TAG_LATEST}"

  deploy-gke:
    name: Rollout on GKE (optional)
    needs: build-and-push
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.GKE_CLUSTER_NAME != ''
    runs-on: [self-hosted, gcp, gke-deploy]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_ACTIONS_SA }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_CLUSTER_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set image and wait for rollout
        run: |
          set -eux
          NS="${{ vars.K8S_NAMESPACE }}"
          NS="${NS:-nest}"
          DEPLOY="${{ vars.K8S_DEPLOYMENT }}"
          DEPLOY="${DEPLOY:-nest-api}"
          CONTAINER="${{ vars.K8S_CONTAINER }}"
          CONTAINER="${CONTAINER:-nest-api}"
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.IMAGE_NAME }}:${GITHUB_SHA}"
          kubectl set image "deployment/${DEPLOY}" "${CONTAINER}=${IMAGE}" -n "${NS}"
          kubectl rollout status "deployment/${DEPLOY}" -n "${NS}" --timeout=5m
