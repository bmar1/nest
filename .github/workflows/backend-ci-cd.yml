
name: Backend CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JVM_VERSION: "21"

jobs:
  test:
    name: Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JVM_VERSION }}
          cache: maven

      - name: Run unit tests
        run: mvn -B test

  build-and-push:
    name: Build & push image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_ACTIONS_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" -q

      - name: Build and push
        env:
          REG_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REPO: ${{ vars.ARTIFACT_REPOSITORY }}
          IMAGE: ${{ vars.IMAGE_NAME }}
        run: |
          set -eux
          TAG_SHA="${REG_HOST}/${PROJECT}/${REPO}/${IMAGE}:${GITHUB_SHA}"
          TAG_LATEST="${REG_HOST}/${PROJECT}/${REPO}/${IMAGE}:latest"
          docker build -t "${TAG_SHA}" -t "${TAG_LATEST}" .
          docker push "${TAG_SHA}"
          docker push "${TAG_LATEST}"


