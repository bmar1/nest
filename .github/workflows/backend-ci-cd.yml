
name: Backend CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JVM_VERSION: "21"

jobs:
  test:
    name: Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JVM_VERSION }}
          cache: maven

      - name: Run unit tests
        run: mvn -B test

  build-and-push:
    name: Build & push image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_ACTIONS_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" -q

      - name: Build and push
        env:
          REG_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REPO: ${{ vars.ARTIFACT_REPOSITORY }}
          IMAGE: ${{ vars.IMAGE_NAME }}
        run: |
          set -eux
          TAG_SHA="${REG_HOST}/${PROJECT}/${REPO}/${IMAGE}:${GITHUB_SHA}"
          TAG_LATEST="${REG_HOST}/${PROJECT}/${REPO}/${IMAGE}:latest"
          docker build -t "${TAG_SHA}" -t "${TAG_LATEST}" .
          docker push "${TAG_SHA}"
          docker push "${TAG_LATEST}"
          echo "Pushed immutable tag: ${TAG_SHA}"

  # Roll out using the same Git SHA as the image tag (not :latest). Requires GitHub Variables:
  # GCP_*, GKE_CLUSTER_NAME, GKE_CLUSTER_LOCATION, K8S_NAMESPACE, K8S_DEPLOYMENT, K8S_CONTAINER.
  # Optional worker: K8S_WORKER_DEPLOYMENT, K8S_WORKER_CONTAINER.
  # Private / authorized-networks clusters: the runner must reach the GKE API (often a self-hosted runner in GCP).
  deploy-gke:
    name: Roll out GKE (immutable SHA tag)
    needs: build-and-push
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.GKE_CLUSTER_NAME != '' && vars.GKE_CLUSTER_LOCATION != '' && vars.K8S_NAMESPACE != '' &&
      vars.K8S_DEPLOYMENT != '' && vars.K8S_CONTAINER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_ACTIONS_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_CLUSTER_LOCATION }}

      - name: Roll out API deployment
        run: |
          set -eux
          IMG="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.IMAGE_NAME }}:${GITHUB_SHA}"
          kubectl set image "deployment/${{ vars.K8S_DEPLOYMENT }}" "${{ vars.K8S_CONTAINER }}=${IMG}" -n "${{ vars.K8S_NAMESPACE }}"
          kubectl rollout status "deployment/${{ vars.K8S_DEPLOYMENT }}" -n "${{ vars.K8S_NAMESPACE }}" --timeout=300s

      - name: Roll out worker deployment
        if: ${{ vars.K8S_WORKER_DEPLOYMENT != '' && vars.K8S_WORKER_CONTAINER != '' }}
        run: |
          set -eux
          IMG="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.IMAGE_NAME }}:${GITHUB_SHA}"
          kubectl set image "deployment/${{ vars.K8S_WORKER_DEPLOYMENT }}" "${{ vars.K8S_WORKER_CONTAINER }}=${IMG}" -n "${{ vars.K8S_NAMESPACE }}"
          kubectl rollout status "deployment/${{ vars.K8S_WORKER_DEPLOYMENT }}" -n "${{ vars.K8S_NAMESPACE }}" --timeout=300s


