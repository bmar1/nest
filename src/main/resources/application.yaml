# Defaults for local dev and containers. Override secrets via env / K8s secrets.
# Queue-mode API + workers: enable Rabbit on readiness (see k8s-examples env vars).
#
# Production on GKE: add profile `gcp` (e.g. SPRING_PROFILES_ACTIVE=worker,gcp) for JSON logs,
# Prometheus scrape at /actuator/prometheus, and HTTP request logs (see application-gcp.yaml).

spring:
  application:
    name: nestapp

nest:
  logging:
    http-requests: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    rabbit:
      enabled: false
